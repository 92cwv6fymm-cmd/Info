# Mise en ligne du site sur GitHub Pages à chaque push sur la branche par défaut.
name: Déployer sur GitHub Pages

on:
  push:
    branches: ["claude/sleep-apnea-info-site-8mu85i", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Configurer Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
